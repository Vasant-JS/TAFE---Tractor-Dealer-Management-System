services:
  - type: web
    name: tafe-dms-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run prisma:push && npm run prisma:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: FRONTEND_URL
        value: https://tafe-dms.onrender.com

  - type: web
    name: tafe-dms
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tafe-dms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
